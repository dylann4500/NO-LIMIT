<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avalon Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root {
  --bg: #faf9f7; --side: #f2f0ec; --panel: #ffffff; --fg: #1f1e1c; --muted: #75716b; --faint: #a6a19a;
  --line: #e6e2dc; --hover: #e9e6e0; --accent: #c4673f; --accent-soft: #f6e7df;
  --ok: #2f8a57; --warn: #b7791f; --bad: #c0392b; --idle: #9a958e; --bubble: #efece6;
  --serif: "Newsreader", Georgia, serif; --sans: "Inter", system-ui, -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1d1d1b; --side: #171716; --panel: #262624; --fg: #ecebe8; --muted: #a29f99; --faint: #6f6c67;
  --line: #33322f; --hover: #2c2b29; --accent: #dd8a64; --accent-soft: #3a2a22;
  --ok: #5cc48d; --warn: #e5b45a; --bad: #ef7c6d; --idle: #7d7a75; --bubble: #30302d; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); }
button { font: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); height: 100%; }
@media (max-width: 760px) { .app { grid-template-columns: 1fr; } .side { display: none; } .app.menu .side { display: flex; position: fixed; inset: 0; z-index: 20; } }
/* sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.brand b { font: 500 1.25rem var(--serif); letter-spacing: -.01em; }
.brand .who { margin-left: auto; font-size: .78rem; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.bus { padding: 0 18px 10px; font-size: .74rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.list { overflow-y: auto; padding: 4px 10px 16px; flex: 1; }
.sec { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 14px 10px 6px; font-weight: 600; }
.item { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: start; text-align: left; background: none; border: 0; border-radius: 9px; padding: 8px 10px; color: var(--fg); }
.item:hover { background: var(--hover); } .item.on { background: var(--hover); }
.item.sub { padding-left: 22px; }
.item .nm { font-weight: 500; font-size: .92rem; } .item .ln { color: var(--muted); font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); margin-top: 8px; }
.dot.working, .dot.starting { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); animation: pulse 1.6s infinite; }
.dot.waiting { background: var(--warn); } .dot.error { background: var(--bad); } .dot.stopped { background: transparent; border: 1.5px solid var(--idle); }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 10%, transparent); } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
.badge { background: var(--accent); color: #fff; border-radius: 999px; font-size: .68rem; padding: 0 6px; margin-top: 3px; font-weight: 600; }
/* main */
.main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-bottom: 1px solid var(--line); background: var(--bg); flex-wrap: wrap; }
.top h1 { font: 500 1.15rem var(--serif); margin: 0; }
.chip { font-size: .72rem; border-radius: 999px; padding: 1px 9px; background: var(--hover); color: var(--muted); }
.top .sp { flex: 1; }
.tbtn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 11px; color: var(--muted); font-size: .82rem; }
.tbtn:hover { color: var(--fg); border-color: var(--muted); } .tbtn.on { color: var(--accent); border-color: var(--accent); }
.menu-btn { display: none; } @media (max-width: 760px) { .menu-btn { display: inline-block; } }
.banners { display: flex; flex-direction: column; gap: 8px; padding: 10px 22px 0; }
.banner { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner.risky { border-color: var(--bad); } .banner.urgent { border-color: var(--accent); }
.banner .tx { flex: 1; min-width: 220px; font-size: .88rem; } .banner code { font: .8rem var(--mono); word-break: break-all; }
.banner .act { display: flex; gap: 6px; }
.pbtn { border: 0; border-radius: 8px; padding: 5px 12px; background: var(--fg); color: var(--bg); font-size: .82rem; font-weight: 500; }
.pbtn.ghost { background: none; color: var(--fg); border: 1px solid var(--line); }
.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.conv { max-width: 780px; margin: 0 auto; padding: 24px 22px 40px; display: flex; flex-direction: column; gap: 14px; }
.u { align-self: flex-end; background: var(--bubble); border-radius: 18px; padding: 9px 16px; max-width: 82%; white-space: pre-wrap; overflow-wrap: anywhere; }
.u .by { display: block; font-size: .7rem; color: var(--muted); }
.a { font: 1.04rem/1.65 var(--serif); overflow-wrap: anywhere; } .a p { margin: .5em 0; }
.a.sub { font-size: .95rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }
.a table, .sum table { border-collapse: collapse; font: .86rem var(--sans); display: block; overflow-x: auto; }
.a th, .a td, .sum th, .sum td { border: 1px solid var(--line); padding: 3px 8px; font-variant-numeric: tabular-nums; }
.a code, .sum code { font: .82em var(--mono); background: var(--hover); padding: 1px 5px; border-radius: 4px; }
.a pre, .sum pre { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; border-radius: 10px; overflow-x: auto; font-size: .8rem; }
.a pre code { background: none; padding: 0; }
.tool { font: .8rem var(--mono); color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.tool details { min-width: 0; flex: 1; } .tool summary { cursor: pointer; list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool summary::-webkit-details-marker { display: none; } .tool .res { white-space: pre-wrap; max-height: 260px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 6px; }
.tool .ic { color: var(--faint); } .tool.err .ic { color: var(--bad); }
.msg { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 9px 14px; font-size: .9rem; }
.msg .hd { font-size: .74rem; color: var(--muted); margin-bottom: 2px; } .msg .hd b { color: var(--accent); font-weight: 600; }
.msg.out { margin-left: 48px; background: transparent; } .msg.in { margin-right: 48px; }
.note { align-self: center; font-size: .76rem; color: var(--faint); }
.err { color: var(--bad); font-size: .85rem; white-space: pre-wrap; }
.empty { color: var(--muted); text-align: center; margin-top: 18vh; font: 1.2rem var(--serif); }
.sum { max-width: 780px; margin: 0 auto; padding: 24px 22px; }
.comp { padding: 0 22px 18px; }
.box { max-width: 780px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px 8px 16px; box-shadow: 0 1px 8px rgba(0,0,0,.04); }
.box textarea { width: 100%; border: 0; resize: none; background: none; color: var(--fg); font: 15px/1.5 var(--sans); min-height: 26px; max-height: 220px; outline: none; }
.box .row { display: flex; align-items: center; gap: 10px; } .box .hint { font-size: .74rem; color: var(--faint); flex: 1; }
.send { width: 32px; height: 32px; border-radius: 9px; border: 0; background: var(--accent); color: #fff; font-size: 1rem; }
.send:disabled { opacity: .35; cursor: default; }
/* picker */
#root { min-height: 100%; }
.pick { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 56px 16px; }
.pick .card { text-align: center; width: 100%; max-width: 460px; }
.pick h1 { font: 400 2.1rem/1.2 var(--serif); margin: 0 0 8px; } .pick p { color: var(--muted); margin: 0 0 26px; }
.pick .ps { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 420px) { .pick .ps { grid-template-columns: 1fr; } }
.pick button { padding: 24px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 500 1.2rem var(--serif); }
.pick button.mine { border-color: var(--accent); } .pick button:hover { border-color: var(--accent); }
.pick small { display: block; font: .76rem var(--sans); color: var(--muted); margin-top: 6px; } .pick button.mine small { color: var(--accent); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const S = { st: null, me: null, view: null, sel: null, events: {}, showSum: false, unread: {}, sending: false };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (t) => { try { const h = marked.parse(String(t || "")); return window.DOMPurify ? DOMPurify.sanitize(h) : esc(t); } catch (e) { return "<p>" + esc(t) + "</p>"; } };
const api = (p, body) => fetch(p, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());
const hhmm = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const titleOf = (n) => { const a = (S.st?.agents || []).concat(S.st?.remote || []).find((x) => x.name === n); return a ? a.title + (S.st.agents.find((x) => x.name === n) ? "" : " (" + (S.st.people[a.person] || "") + ")") : n; };

async function load() {
  S.st = await api("/api/state");
  try { S.view = localStorage.getItem("hub-view"); S.sel = localStorage.getItem("hub-sel"); } catch (e) {}
  const h = location.hash.slice(1); if (S.st.people[h]) S.view = h;
  if (!S.view) return renderPicker();
  if (!S.sel || !allAgents().some((a) => a.name === S.sel)) S.sel = myList()[0]?.name;
  render(); if (S.sel && isLocal(S.sel)) loadEvents(S.sel);
  stream();
}
function allAgents() { return S.st.agents.concat(S.st.remote); }
function isLocal(n) { return S.st.agents.some((a) => a.name === n); }
function myList() { return S.view === S.st.me ? S.st.agents : S.st.remote.filter((a) => a.person === S.view); }
function renderPicker() {
  $("#root").innerHTML = `<div class="pick"><div class="card"><h1>Avalon Hub</h1><p>Who's at this laptop?</p><div class="ps">${
    Object.entries(S.st.people).map(([k, v]) => `<button data-p="${k}" class="${k === S.st.me ? "mine" : ""}">${v}<small>${k === S.st.me ? "This laptop · your agents" : "Their agents, read-only"}</small></button>`).join("")}</div></div></div>`;
  document.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => { S.view = b.dataset.p; try { localStorage.setItem("hub-view", S.view); } catch (e) {} S.sel = myList()[0]?.name; render(); if (S.sel && isLocal(S.sel)) loadEvents(S.sel); stream(); });
}
function sidebar() {
  const list = myList();
  const ov = list.filter((a) => /overseer$/.test(a.name)), rest = list.filter((a) => !/overseer$/.test(a.name));
  const item = (a, sub) => `<button class="item ${sub ? "sub" : ""} ${a.name === S.sel ? "on" : ""}" data-sel="${a.name}"><span class="dot ${esc(a.state)}"></span><span><div class="nm">${esc(a.title)}</div><div class="ln">${esc(a.task || a.state)}</div></span>${S.unread[a.name] ? `<span class="badge">${S.unread[a.name]}</span>` : ""}</button>`;
  const other = Object.keys(S.st.people).filter((p) => p !== S.view);
  const b = S.st.bus;
  return `<div class="side"><div class="brand"><b>Avalon</b><button class="who" id="who">${esc(S.st.people[S.view])} ▾</button></div>
    <div class="bus"><span class="dot ${b.online ? "idle" : "error"}" style="margin:0;${b.online ? "background:var(--ok)" : ""}"></span>${b.online ? "Linked to " + other.map((p) => S.st.people[p]).join(", ") + "'s laptop" : esc(b.error || "Offline")}${b.outbox ? ` · ${b.outbox} waiting to send` : ""}</div>
    <div class="list">${ov.map((a) => item(a, false)).join("")}${rest.length ? `<div class="sec">Agents</div>` + rest.map((a) => item(a, true)).join("") : ""}
    ${S.view !== S.st.me ? `<div class="sec" style="padding-top:20px">Read-only view: these run on ${esc(S.st.people[S.view])}'s laptop. Messages you send go to the agent.</div>` : ""}</div></div>`;
}
function banners() {
  if (S.view !== S.st.me) return "";
  const ap = S.st.approvals.map((a) => `<div class="banner ${a.risky ? "risky" : ""}"><div class="tx"><b>${esc(titleOf(a.agent))}</b> wants to run ${esc(a.tool)}${a.risky ? " <b style='color:var(--bad)'>(risky)</b>" : ""}<br><code>${esc(a.input)}</code></div><div class="act"><button class="pbtn" data-ap="${a.id}" data-d="allow">Allow</button>${a.risky ? "" : `<button class="pbtn ghost" data-ap="${a.id}" data-d="always">Always for this agent</button>`}<button class="pbtn ghost" data-ap="${a.id}" data-d="deny">Deny</button></div></div>`).join("");
  const al = S.st.alerts.map((a) => `<div class="banner ${a.urgent ? "urgent" : ""}"><div class="tx"><b>${esc(titleOf(a.agent))}</b> · ${hhmm(a.at)}<br>${esc(a.text)}</div><div class="act"><button class="pbtn ghost" data-dis="${a.id}">Done</button></div></div>`).join("");
  return ap || al ? `<div class="banners">${ap}${al}</div>` : "";
}
function convHtml() {
  const a = allAgents().find((x) => x.name === S.sel);
  if (!a) return `<div class="empty">No agent selected.</div>`;
  if (S.showSum || !isLocal(a.name)) return `<div class="sum">${a.summary ? `<div class="a">${md(a.summary)}</div>` : `<div class="empty">No summary posted yet.</div>`}</div>`;
  const evs = S.events[a.name] || [];
  if (!evs.length) return `<div class="empty">${a.state === "stopped" ? "Not started. Send a message to start it." : "Starting…"}</div>`;
  const results = {}; evs.forEach((e) => { if (e.type === "tool_result") results[e.id] = e; });
  return `<div class="conv">${evs.map((e) => {
    switch (e.type) {
      case "user": return `<div class="u"><span class="by">${esc(e.from && e.from !== "human" ? e.from : "")}</span>${esc(e.text)}</div>`;
      case "text": return `<div class="a ${e.sub ? "sub" : ""}">${md(e.text)}</div>`;
      case "tool": { if (e.name === "ToolSearch" || e.name === "mcp__hub__send_message") return "";
        const r = results[e.id]; const nm = e.name.replace(/^mcp__hub__/, "");
        return `<div class="tool ${r?.error ? "err" : ""}"><span class="ic">${r ? (r.error ? "✕" : "✓") : "…"}</span><details data-k="${esc(e.id)}"><summary>${esc(nm)} ${esc(e.input)}</summary>${r ? `<div class="res">${esc(r.text)}</div>` : ""}</details></div>`; }
      case "msg_in": return `<div class="msg in"><div class="hd">From <b>${esc(titleOf(e.from))}</b> · ${hhmm(e.t)}</div>${md(e.text)}</div>`;
      case "msg_out": return `<div class="msg out"><div class="hd">To <b>${esc(titleOf(e.to))}</b> · ${hhmm(e.t)}</div>${md(e.text)}</div>`;
      case "notify": return `<div class="note">Asked a human: ${esc(e.text)}</div>`;
      case "permission": return `<div class="note">${esc(e.tool)}: ${esc(e.decision)}</div>`;
      case "error": return `<div class="err">${esc(e.text)}</div>`;
      case "result": return "";
      default: return "";
    } }).join("")}</div>`;
}
function render() {
  const a = allAgents().find((x) => x.name === S.sel);
  const local = a && isLocal(a.name);
  const draft = $("#ta")?.value || "";
  const tf = document.activeElement && document.activeElement.id === "ta"; const tsel = tf ? [$("#ta").selectionStart, $("#ta").selectionEnd] : null;
  const openD = new Set([...document.querySelectorAll("details[open]")].map((d) => d.dataset.k));
  const keep = $("#scroll"); const atEnd = !keep || keep.scrollHeight - keep.scrollTop - keep.clientHeight < 80; const prevTop = keep?.scrollTop;
  $("#root").innerHTML = `<div class="app" id="app">${sidebar()}<div class="main">
    <div class="top"><button class="tbtn menu-btn" id="menu">☰</button><h1>${a ? esc(a.title) : "Avalon"}</h1>${a ? `<span class="chip">${esc(a.state)}</span>${local ? `<span class="chip">${esc(a.model.replace("claude-", ""))}</span>` : `<span class="chip">${esc(S.st.people[a.person] || "")}'s laptop</span>`}` : ""}
      <span class="sp"></span>${a && local ? `<button class="tbtn ${S.showSum ? "on" : ""}" id="sumb">Summary</button><button class="tbtn ${a.policy === "ask" ? "on" : ""}" id="pol" title="Ask before every command">${a.policy === "ask" ? "Asking first" : "Auto-approve"}</button>${a.state === "working" ? `<button class="tbtn" id="intr">Interrupt</button>` : ""}<button class="tbtn" id="ss">${a.state === "stopped" ? "Start" : "Stop"}</button>` : ""}</div>
    ${banners()}<div class="scroll" id="scroll">${convHtml()}</div>
    <div class="comp"><form class="box" id="form"><textarea id="ta" rows="1" placeholder="${a ? "Message " + esc(a.title) + (local ? "" : " on " + esc(S.st.people[a.person]) + "'s laptop") : ""}"></textarea><div class="row"><span class="hint">${a && local && a.queued ? a.queued + " queued · " : ""}Enter to send · Shift+Enter for a new line</span><button class="send" id="sendb" ${a ? "" : "disabled"}>↑</button></div></form></div></div></div>`;
  const ta = $("#ta"); ta.value = draft; autosize(ta);
  if (tf) { ta.focus(); try { ta.setSelectionRange(tsel[0], tsel[1]); } catch (e) {} }
  document.querySelectorAll("details[data-k]").forEach((d) => { if (openD.has(d.dataset.k)) d.open = true; });
  const sc = $("#scroll"); if (atEnd) sc.scrollTop = sc.scrollHeight; else sc.scrollTop = prevTop;
  wire();
}
function autosize(t) { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; }
function wire() {
  document.querySelectorAll("[data-sel]").forEach((b) => b.onclick = () => select(b.dataset.sel));
  $("#who")?.addEventListener("click", () => { try { localStorage.removeItem("hub-view"); } catch (e) {} S.view = null; renderPicker(); });
  $("#menu")?.addEventListener("click", () => $("#app").classList.toggle("menu"));
  $("#sumb")?.addEventListener("click", () => { S.showSum = !S.showSum; render(); });
  $("#pol")?.addEventListener("click", async () => { const a = S.st.agents.find((x) => x.name === S.sel); await api(`/api/agents/${S.sel}/policy`, { policy: a.policy === "ask" ? "auto" : "ask" }); });
  $("#intr")?.addEventListener("click", () => api(`/api/agents/${S.sel}/interrupt`, {}));
  $("#ss")?.addEventListener("click", () => { const a = S.st.agents.find((x) => x.name === S.sel); api(`/api/agents/${S.sel}/${a.state === "stopped" ? "start" : "stop"}`, {}); });
  document.querySelectorAll("[data-ap]").forEach((b) => b.onclick = () => api(`/api/approvals/${b.dataset.ap}`, { decision: b.dataset.d }));
  document.querySelectorAll("[data-dis]").forEach((b) => b.onclick = async () => { await api(`/api/alerts/${b.dataset.dis}/dismiss`, {}); S.st.alerts = S.st.alerts.filter((x) => x.id !== b.dataset.dis); render(); });
  const ta = $("#ta");
  ta.addEventListener("input", () => autosize(ta));
  ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#form").requestSubmit(); } });
  $("#form").addEventListener("submit", async (e) => { e.preventDefault(); const t = ta.value.trim(); if (!t || S.sending) return; S.sending = true; ta.value = "";
    try { const r = await api(`/api/agents/${S.sel}/send`, { text: t }); if (r.error) { ta.value = t; alert(r.error); } } finally { S.sending = false; } });
}
function select(n) { S.sel = n; S.showSum = false; S.unread[n] = 0; try { localStorage.setItem("hub-sel", n); } catch (e) {} $("#app")?.classList.remove("menu"); render(); if (isLocal(n)) loadEvents(n); }
async function loadEvents(n) { const r = await api(`/api/agents/${n}/events?since=0`); S.events[n] = r.events || []; if (S.sel === n) render(); }
let es;
function stream() {
  if (es) return;
  es = new EventSource("/api/stream");
  let pending = false; const soon = () => { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; if (S.view) render(); }); } };
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.kind === "event") { (S.events[ev.agent] = S.events[ev.agent] || []).push(ev.event); if (ev.agent !== S.sel && ["text", "msg_in"].includes(ev.event.type)) S.unread[ev.agent] = (S.unread[ev.agent] || 0) + 1; if (ev.agent === S.sel || S.unread[ev.agent]) soon(); }
    else if (ev.kind === "agent") { const i = S.st.agents.findIndex((a) => a.name === ev.name); if (i >= 0) S.st.agents[i] = { ...S.st.agents[i], ...ev }; soon(); }
    else if (ev.kind === "approval") { S.st.approvals.push(ev); soon(); }
    else if (ev.kind === "approval_done") { S.st.approvals = S.st.approvals.filter((a) => a.id !== ev.id); soon(); }
    else if (ev.kind === "alert") { S.st.alerts.push(ev); soon(); }
    else if (ev.kind === "alert_done") { S.st.alerts = S.st.alerts.filter((a) => a.id !== ev.id); soon(); }
  };
  es.onerror = () => {};
  setInterval(async () => { const st = await api("/api/state"); S.st = { ...st }; if (S.view) render(); }, 8000);
}
load();
</script>
