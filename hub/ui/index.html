/* Layout: one calm board of notes by default. Header: brand · countdown · Agents ▾ · bell.

:root {

  --bad: #b42318; --bad-soft: #fbd6c8; --idle: #8a8270; --busy: #1d4ed8; --busy-soft: #dbe5fb;
  /* note papers at matched lightness (about L* 90) so no kind shouts; inks at about L* 30 */
  --n-live: #d2ebc6; --n-live-ink: #14532d; --n-change: #f8e2a0; --n-change-ink: #6b3f00; --n-finding: #e4dcf3; --n-finding-ink: #4c1d95;
  --n-research: #cfe9e3; --n-research-ink: #0f5650; --n-idea: #d6e3f6; --n-idea-ink: #1e3a8a;
  /* one light, from above: every raised surface uses these */
  --lift-1: 0 1px 2px rgba(74, 56, 0, .10), 0 4px 12px -6px rgba(74, 56, 0, .22);
  --lift-2: 0 2px 4px rgba(74, 56, 0, .12), 0 16px 32px -14px rgba(74, 56, 0, .32);
  --ease-out: cubic-bezier(.2, .8, .2, 1); --t-fast: 120ms; --t-med: 220ms; --t-slow: 320ms;
  --p-samuel: #4f46e5; --p-dylan: #be185d;

  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; --display: "IBM Plex Sans", system-ui, sans-serif;

const svc = (n) => S.st.services.find((s) => s.name === n);
const agentByName = (n) => S.st.agents.find((a) => a.name === n) || svc(n) || S.st.remote.find((a) => a.name === n);
const clean = (t) => String(t || "").replace(" (hub)", "");
const personOf = (n) => n && n.startsWith("s-") ? "samuel" : n && n.startsWith("d-") ? "dylan" : Object.keys(S.st.people).find((k) => S.st.people[k] === n) || "";

const kindOf = (p) => KMAP[p.kind] || p.kind;
