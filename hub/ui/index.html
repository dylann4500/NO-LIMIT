  --n-live: #1f3a29; --n-live-ink: #8fdcaa; --n-change: #3d3418; --n-change-ink: #f2d36b; --n-finding: #2e2747; --n-finding-ink: #c3b1f5;

    const r = await fetch(`/api/bots/${encodeURIComponent(n)}/download`); if (!r.ok) { let j = {}; try { j = await r.json(); } catch (x) {} if (h) h.textContent = j.error || "Download failed."; return; }
    const url = URL.createObjectURL(await r.blob()); const a = document.createElement("a"); a.href = url; a.download = n + ".zip"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    if (h) h.textContent = `Downloaded ${n}.zip. Upload it on the No Limit dashboard and make it active.`; });
  document.querySelectorAll("[data-chip]").forEach((b) => b.onclick = () => { const t = $("#cardTa"); if (!t) return; t.value = b.dataset.chip; $("#cardForm").requestSubmit(); });
  $("#cvBack")?.addEventListener("click", () => { S.card = null; render(); });
  $("#repGo")?.addEventListener("click", () => makeReport(S.card));
  $("#cardX")?.addEventListener("click", () => { S.card = null; render(); });
  $("#startBtn")?.addEventListener("click", async () => { $("#startBtn").disabled = true; $("#startBtn").textContent = "Starting…"; const r = await api("/api/start", {}); if (r.error) $("#startBtn").textContent = r.error; refresh(); });
  $("#schin")?.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#schgo").click(); });
  $("#schgo")?.addEventListener("click", async () => { const r = await api("/api/schedule", { start: $("#schin").value }); if (r.error) $("#schin").style.borderColor = "var(--bad)"; else { $("#schin").blur(); refresh(); } });
  $("#ideaOpen")?.addEventListener("click", () => { S.ideaOpen = true; render(); setTimeout(() => $("#ideaBody")?.focus(), 20); });
  $("#ideaX")?.addEventListener("click", () => { S.ideaOpen = false; render(); });
  $("#ideaGo")?.addEventListener("click", async () => { const t = $("#ideaBody").value.trim(); if (!t) { $("#ideaHint").textContent = "Type something first."; return; } $("#ideaGo").disabled = true;
    const first = t.split("\n")[0], title = first.length > 110 ? first.slice(0, 107).replace(/\s+\S*$/, "") + "…" : first;
    const r = await api("/api/props", { title, body: t === title ? "" : t }); if (r.error) { $("#ideaHint").textContent = r.error; $("#ideaGo").disabled = false; return; }
    S.ideaOpen = false; document.activeElement?.blur(); S.st.props.unshift(r); render(); });
  const cta = $("#cardTa"); if (cta) { cta.addEventListener("input", () => autosize(cta)); cta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#cardForm").requestSubmit(); } });
    $("#cardForm").addEventListener("submit", async (e) => { e.preventDefault(); const t = cta.value.trim(); if (!t) return; $("#cardSend").disabled = true;
      cta.value = ""; autosize(cta);   // clear at once; a re-render while sending must not bring the text back
      const p = props().find((x) => x.id === S.card); const call = p && ["needs_call", "revise"].includes(p.status) && myCall(p);
      const r = call ? await api(`/api/props/${encodeURIComponent(S.card)}/act`, { action: "comment", text: t }) : await api(`/api/props/${encodeURIComponent(S.card)}/ask`, { text: t });
      const sb = $("#cardSend"); if (sb) sb.disabled = false;
      if (r.error) { const ta2 = $("#cardTa"); if (ta2 && !ta2.value) ta2.value = t; const h = $("#cardHint"); if (h) { h.textContent = r.error; h.className = "hint bad"; } return; }
      const i = S.st.props.findIndex((x) => x.id === r.id); if (i >= 0) S.st.props[i] = r; render(); }); }
  $("#intr")?.addEventListener("click", () => api(`/api/agents/${encodeURIComponent(a.name)}/interrupt`, {}));
  $("#ss")?.addEventListener("click", async () => { await api(`/api/agents/${encodeURIComponent(a.name)}/${a.state === "stopped" ? "start" : "stop"}`, {}); refresh(); });
  const ta = $("#ta"); if (!ta) return;
  document.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => { const q = QUICK[+b.dataset.q][1]; ta.value = q; if (q.endsWith(": ")) { ta.focus(); autosize(ta); } else $("#form").requestSubmit(); });
  ta.addEventListener("input", () => autosize(ta)); ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#form").requestSubmit(); } });
  $("#form").addEventListener("submit", async (e) => { e.preventDefault(); const t = ta.value.trim(); if (!t || S.sending) return; S.sending = true; $("#sendb").disabled = true; ta.value = ""; autosize(ta);
    const r = await api(`/api/agents/${encodeURIComponent(a.name)}/send`, { text: t }); S.sending = false; const b = $("#sendb"); if (b) b.disabled = false;
    const h = $("#hint"); if (r.error) { const t2 = $("#ta"); if (t2 && !t2.value) t2.value = t; if (h) { h.textContent = "Not sent: " + r.error; h.className = "hint bad"; } } });
}
async function loadEvents(n) { const r = await api(`/api/agents/${encodeURIComponent(n)}/events?since=${S.last[n] ?? -1}`); if (r.error) return;
  if (r.last_i !== undefined && S.last[n] !== undefined && r.last_i < S.last[n]) { S.ev[n] = []; S.last[n] = -1; return loadEvents(n); }
  const have = S.ev[n] || [], seen = new Set(have.map((e) => e.i)); S.ev[n] = have.concat((r.events || []).filter((e) => !seen.has(e.i))).sort((x, y) => x.i - y.i).slice(-1500);
  if (S.ev[n].length) S.last[n] = S.ev[n][S.ev[n].length - 1].i; if (S.page === "agent") soon(); }
async function refresh() { const st = await api("/api/state"); if (st.error) return; const known = new Set((S.st.props || []).filter((p) => p.status === "needs_call").map((p) => p.id)); S.st = st;
  (st.props || []).filter((p) => p.status === "needs_call" && myCall(p) && !known.has(p.id)).forEach((p) => toast({ type: "pc", agent: p.author, at: p.updated, ...p })); soon(); }
let raf = false; function soon() { if (!raf) { raf = true; requestAnimationFrame(() => { raf = false; render(); }); } }
let es;
function stream() {
  if (es) return; es = new EventSource("/api/stream");
  es.onmessage = (m) => { const ev = JSON.parse(m.data);
    if (ev.kind === "hello" || ev.kind === "resync") { refresh(); S.st.agents.forEach((a) => loadEvents(a.name)); return; }
    if (ev.kind === "event") { const arr = S.ev[ev.agent] = S.ev[ev.agent] || []; if (!arr.some((e) => e.i === ev.event.i)) { arr.push(ev.event); if (ev.event.i > (S.last[ev.agent] ?? -1)) S.last[ev.agent] = ev.event.i; }
      if (!(S.page === "agent" && S.sel === ev.agent) && ((ev.event.type === "text" && !ev.event.sub) || ev.event.type === "msg_in")) S.unread[ev.agent] = (S.unread[ev.agent] || 0) + 1;
      if (S.page === "agent" || S.side) soon(); }
    else if (ev.kind === "agent") { const i = S.st.agents.findIndex((a) => a.name === ev.name); if (i >= 0) S.st.agents[i] = { ...S.st.agents[i], ...ev }; if (S.side || S.page !== "board") soon(); }
    else if (ev.kind === "service") { const i = S.st.services.findIndex((s) => s.name === ev.name); if (i >= 0) S.st.services[i] = ev; else S.st.services.push(ev); if (S.side || S.page !== "board") soon(); }
    else if (ev.kind === "approval") { S.st.approvals.push(ev); toast({ type: "ap", ...ev }); soon(); }
    else if (ev.kind === "approval_done") { S.st.approvals = S.st.approvals.filter((a) => a.id !== ev.id); soon(); }
    else if (ev.kind === "alert") { S.st.alerts.push(ev); toast({ type: "al", ...ev }); soon(); }
    else if (ev.kind === "alert_done") { S.st.alerts = S.st.alerts.filter((a) => a.id !== ev.id); soon(); }
    else if (ev.kind === "prop") { const p = ev.prop; S.st.props = S.st.props || []; const i = S.st.props.findIndex((x) => x.id === p.id); const was = i >= 0 ? S.st.props[i].status : null; if (i >= 0) S.st.props[i] = p; else S.st.props.unshift(p);
      if (p.status === "needs_call" && was !== "needs_call" && myCall(p)) toast({ type: "pc", agent: p.author, at: p.updated, ...p }); soon(); }
    else if (ev.kind === "shared") refresh(); };
  setInterval(refresh, 6000);
  setInterval(() => { const el = $("#cdn"); if (el) { const left = +el.dataset.at - Date.now() / 1000; el.textContent = mmss(left); el.className = "t " + (left < 60 ? "now" : left < 180 ? "soon" : ""); if (left < -2) refresh(); }
    document.querySelectorAll("[data-dl]").forEach((d) => { d.textContent = mmss(+d.dataset.dl - Date.now() / 1000); }); }, 1000);
  document.addEventListener("selectionchange", () => { if (S.pending && !window.getSelection().toString()) soon(); });
  document.addEventListener("compositionstart", () => { S.composing = true; }); document.addEventListener("compositionend", () => { S.composing = false; if (S.pending) soon(); });
  document.addEventListener("mousedown", () => { S.mouseDown = true; }); document.addEventListener("mouseup", () => { S.mouseDown = false; if (S.pending) setTimeout(soon, 0); });
  document.addEventListener("focusout", () => { if (S.pending) setTimeout(soon, 0); });
  document.addEventListener("click", (e) => { if (S.liveOpen && !e.target.closest("#liveMenu") && !e.target.closest("#liveT")) { S.liveOpen = false; soon(); }
    if (S.bell && !e.target.closest("#panel") && !e.target.closest("#bell") && !e.target.closest(".toasts")) { S.bell = false; soon(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (S.liveOpen) S.liveOpen = false; else if (S.bell) S.bell = false; else if (S.card) S.card = null; else if (S.side) S.side = false; soon(); } });
}
load();
