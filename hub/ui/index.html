<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avalon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<style>
:root {
  --bg: #faf9f7; --side: #f2f0ec; --panel: #ffffff; --fg: #1f1e1c; --muted: #75716b; --faint: #a6a19a;
  --line: #e6e2dc; --hover: #e9e6e0; --accent: #c4673f; --accent-soft: #f6e7df;
  --ok: #2f8a57; --warn: #b7791f; --warn-soft: #fbf0db; --bad: #c0392b; --bad-soft: #fbe4e1; --idle: #9a958e; --bubble: #efece6;
  --serif: "Newsreader", Georgia, serif; --sans: "Inter", system-ui, -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1d1d1b; --side: #171716; --panel: #262624; --fg: #ecebe8; --muted: #a29f99; --faint: #6f6c67;
  --line: #33322f; --hover: #2c2b29; --accent: #dd8a64; --accent-soft: #3a2a22;
  --ok: #5cc48d; --warn: #e5b45a; --warn-soft: #3a3020; --bad: #ef7c6d; --bad-soft: #3d221f; --idle: #7d7a75; --bubble: #30302d; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#root { height: 100%; }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px 4px; }
.brand b { font: 500 1.3rem var(--serif); letter-spacing: -.01em; }
.who { margin-left: auto; font-size: .78rem; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.clock { padding: 2px 18px 10px; font-size: .78rem; color: var(--muted); }
.clock b { color: var(--fg); font-weight: 500; }
.list { overflow-y: auto; padding: 0 10px 16px; flex: 1; }
.sec { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 14px 10px 4px; font-weight: 600; display: flex; justify-content: space-between; }
.item { width: 100%; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 9px; align-items: start; text-align: left; background: none; border: 0; border-radius: 9px; padding: 7px 10px; }
.item:hover, .item.on { background: var(--hover); }
.item .nm { font-weight: 500; font-size: .92rem; display: flex; gap: 6px; align-items: baseline; }
.item .st { font-size: .72rem; color: var(--muted); font-weight: 400; }
.item .ln { color: var(--muted); font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.stale { opacity: .5; }
.item.svc .nm { font-weight: 400; font-size: .86rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); margin-top: 7px; }
.dot.working, .dot.starting { background: var(--ok); animation: pulse 1.6s infinite; }
.dot.waiting, .dot.blocked { background: var(--warn); } .dot.error, .dot.limited { background: var(--bad); }
.dot.stopped, .dot.offline { background: transparent; border: 1.5px solid var(--idle); }
.dot.done { background: var(--accent); } .dot.home { background: none; margin-top: 0; width: auto; height: auto; color: var(--muted); }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
.pill { font-size: .66rem; font-weight: 600; border-radius: 999px; padding: 0 7px; background: var(--warn-soft); color: var(--warn); margin-top: 4px; white-space: nowrap; }
.badge { background: var(--accent); color: #fff; border-radius: 999px; font-size: .66rem; padding: 0 6px; margin-top: 4px; font-weight: 600; }
.needs { margin: 6px 10px 2px; border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 12px; padding: 8px 10px 10px; max-height: 45vh; overflow-y: auto; flex: none; }
.needs h3 { margin: 0 0 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--warn); }
.need { font-size: .84rem; padding: 8px 0; border-top: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); }
.need:first-of-type { border-top: 0; }
.need .who2 { font-weight: 600; } .need code { font: .74rem var(--mono); word-break: break-all; display: block; color: var(--muted); max-height: 3.2em; overflow: hidden; }
.need .txt { overflow-wrap: anywhere; } .need .txt p { margin: 2px 0; }
.need .acts { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.mini { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 2px 9px; font-size: .76rem; }
.mini.go { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.mini:disabled { opacity: .4; cursor: default; }
.main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.top { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 22px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top h1 { font: 500 1.2rem var(--serif); margin: 0; }
.lbl { font-size: .76rem; border-radius: 999px; padding: 1px 10px; background: var(--hover); color: var(--muted); white-space: nowrap; }
.lbl.working { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.lbl.waiting, .lbl.blocked { background: var(--warn-soft); color: var(--warn); }
.lbl.error, .lbl.limited { background: var(--bad-soft); color: var(--bad); }
.top .sp { flex: 1; }
.tbtn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 11px; color: var(--muted); font-size: .82rem; }
.tbtn:hover { color: var(--fg); border-color: var(--muted); }
.seg { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: .78rem; }
.seg span { padding: 4px 4px 4px 10px; color: var(--muted); } .seg button { border: 0; background: none; padding: 4px 9px; color: var(--muted); }
.seg button.on { background: var(--hover); color: var(--fg); font-weight: 500; }
.menu { position: relative; } .menu .pop { position: absolute; right: 0; top: 34px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; z-index: 5; min-width: 230px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
.menu .pop button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 7px; font-size: .86rem; }
.menu .pop button:hover { background: var(--hover); } .menu .pop .danger { color: var(--bad); }
.bell { position: relative; background: none; border: 1px solid var(--line); border-radius: 9px; width: 34px; height: 30px; display: inline-grid; place-items: center; color: var(--muted); }
.bell:hover { color: var(--fg); border-color: var(--muted); } .bell.has { color: var(--warn); border-color: var(--warn); }
.bell svg { width: 16px; height: 16px; }
.bell .n { position: absolute; top: -6px; right: -7px; background: var(--warn); color: #fff; border-radius: 999px; font-size: .64rem; font-weight: 700; padding: 0 5px; line-height: 1.5; }
.bell.urgent .n { background: var(--bad); }
.panel { position: fixed; top: 54px; right: 16px; width: min(400px, calc(100vw - 32px)); max-height: 72vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.18); z-index: 30; padding: 6px 14px 10px; }
.panel h3 { font: 600 .7rem var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 8px 0 4px; display: flex; justify-content: space-between; }
.panel h3 button { border: 0; background: none; color: var(--accent); font-size: .74rem; text-transform: none; letter-spacing: 0; }
.panel .empty2 { color: var(--muted); font-size: .86rem; padding: 14px 0; text-align: center; }
.toasts { position: fixed; top: 58px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 40; width: min(360px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 9px 12px; font-size: .84rem; animation: tin .18s ease-out; }
.toast.urgent { border-left-color: var(--bad); } .toast .x { float: right; border: 0; background: none; color: var(--faint); padding: 0 0 0 8px; }
.toast .txt { overflow-wrap: anywhere; max-height: 7.5em; overflow: hidden; } .toast .txt p { margin: 2px 0; }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
.linkbar { flex: none; background: var(--bad-soft); color: var(--bad); font-size: .84rem; padding: 7px 22px; border-bottom: 1px solid var(--line); }
.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.conv { max-width: 800px; margin: 0 auto; padding: 18px 22px 30px; display: flex; flex-direction: column; gap: 12px; }
.pin { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; }
.pin summary { cursor: pointer; padding: 8px 14px; font-size: .82rem; color: var(--muted); list-style: none; }
.pin summary::-webkit-details-marker { display: none; } .pin .body { padding: 0 16px 10px; }
.u { align-self: flex-end; background: var(--bubble); border-radius: 18px; padding: 8px 16px; max-width: 82%; white-space: pre-wrap; overflow-wrap: anywhere; }
.u .by { display: block; font-size: .7rem; color: var(--muted); }
.u.queued { opacity: .65; border: 1px dashed var(--muted); }
.a { font: 1.04rem/1.65 var(--serif); overflow-wrap: anywhere; } .a p { margin: .45em 0; }
.a.sub { font-size: .94rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }
.md table { border-collapse: collapse; font: .86rem var(--sans); display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 3px 8px; font-variant-numeric: tabular-nums; }
.md code { font: .82em var(--mono); background: var(--hover); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; border-radius: 10px; overflow-x: auto; font-size: .8rem; }
.md pre code { background: none; padding: 0; }
.steps { font: .8rem var(--sans); color: var(--muted); }
.steps > summary { cursor: pointer; list-style: none; } .steps > summary::-webkit-details-marker { display: none; }
.steps .live { color: var(--fg); }
.step { font: .76rem var(--mono); color: var(--muted); padding: 2px 0 2px 14px; overflow: hidden; }
.step > details > summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; list-style: none; }
.step.err { color: var(--bad); }
.step .res { white-space: pre-wrap; max-height: 220px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 4px 0; }
.msgl { font-size: .86rem; } .msgl > summary { cursor: pointer; list-style: none; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msgl > summary::-webkit-details-marker { display: none; } .msgl b { color: var(--accent); font-weight: 600; }
.msgl .k { font-size: .64rem; text-transform: uppercase; letter-spacing: .06em; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin: 0 6px; }
.msgl .body { border-left: 2px solid var(--accent-soft); padding: 2px 0 2px 12px; margin: 4px 0 0 4px; color: var(--fg); }
.div { align-self: center; font-size: .72rem; color: var(--faint); }
.note { align-self: center; font-size: .76rem; color: var(--faint); text-align: center; }
.err { color: var(--bad); font-size: .85rem; white-space: pre-wrap; }
.empty { color: var(--muted); text-align: center; margin: 14vh auto 0; font: 1.15rem var(--serif); max-width: 46ch; }
.comp { flex: none; padding: 0 22px 16px; }
.box { max-width: 800px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px 8px 16px; box-shadow: 0 1px 8px rgba(0,0,0,.04); }
.box textarea { width: 100%; border: 0; resize: none; background: none; color: var(--fg); font: 15px/1.5 var(--sans); min-height: 26px; max-height: 220px; outline: none; }
.box .row { display: flex; align-items: center; gap: 10px; } .box .hint { font-size: .74rem; color: var(--faint); flex: 1; } .box .hint.bad { color: var(--bad); }
.send { width: 32px; height: 32px; border-radius: 9px; border: 0; background: var(--accent); color: #fff; font-size: 1rem; }
.send:disabled { opacity: .35; cursor: default; }
.home { max-width: 980px; margin: 0 auto; padding: 22px; display: flex; flex-direction: column; gap: 20px; }
.home h2 { font: 500 1.05rem var(--serif); margin: 0 0 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card:hover { border-color: var(--muted); } .card.stale { opacity: .55; }
.card .hd { display: flex; gap: 8px; align-items: center; } .card .hd b { font: 500 1.02rem var(--serif); } .card .hd .lbl { margin-left: auto; }
.card .task { font-size: .86rem; } .card .last { font-size: .8rem; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.card .meta { font-size: .72rem; color: var(--faint); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.fact { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: .88rem; }
.fact .k2 { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; }
.fact input { font: inherit; width: 90px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--fg); }
.pick { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 56px 16px; }
.pick .cardp { text-align: center; width: 100%; max-width: 460px; }
.pick h1 { font: 400 2.1rem/1.2 var(--serif); margin: 0 0 8px; } .pick p { color: var(--muted); margin: 0 0 26px; }
.pick .ps { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pick button { padding: 24px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); font: 500 1.2rem var(--serif); }
.pick button.mine { border-color: var(--accent); } .pick button:hover { border-color: var(--accent); }
.pick small { display: block; font: .76rem var(--sans); color: var(--muted); margin-top: 6px; } .pick button.mine small { color: var(--accent); }
.back { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .app .side { display: none; }
  .app.menu-open .side { display: flex; position: fixed; inset: 0; z-index: 20; }
  .back { display: inline-block; }
  .pick .ps { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const S = { st: null, view: null, sel: "home", ev: {}, last: {}, unread: {}, sumOpen: {}, menu: false, bell: false, toasts: [], sending: false, hint: "", hintBad: false, pendingRender: false };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (t) => { try { if (!window.marked || !window.DOMPurify) return "<p>" + esc(t) + "</p>"; return DOMPurify.sanitize(marked.parse(String(t || "")), { FORBID_TAGS: ["img", "style", "form", "input", "iframe", "video", "audio"], FORBID_ATTR: ["style"] }); } catch (e) { return "<p>" + esc(t) + "</p>"; } };
const api = async (p, body) => { let r; try { r = await fetch(p, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); } catch (e) { return { error: "The hub isn't answering. Is its terminal window still open?" }; } let j = {}; try { j = await r.json(); } catch (e) {} if (!r.ok && !j.error) j.error = "The hub didn't answer (" + r.status + ")."; return j; };
const hhmm = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const ago = (t) => { if (!t) return ""; const s = Math.max(0, Date.now() / 1000 - t); return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago"; };
const isOv = (n) => /overseer$/.test(n || "");
const local = (n) => S.st.agents.some((a) => a.name === n);
const svc = (n) => S.st.services.find((s) => s.name === n);
const agentByName = (n) => S.st.agents.find((a) => a.name === n) || svc(n) || S.st.remote.find((a) => a.name === n);
const clean = (t) => String(t || "").replace(" (hub)", "");
const titleOf = (n) => { if (n === "hub") return "Hub"; if (Object.values(S.st.people).includes(n)) return n; const a = agentByName(n); if (!a) return n; const rp = !local(n) && !svc(n) && a.person && a.person !== S.view ? ` (${S.st.people[a.person] || ""})` : ""; return clean(a.title || n) + rp; };
function label(a) {
  if (!a) return ["", ""];
  if (a.stale) return ["Offline", "offline"];
  const st = a.state;
  if (st === "working") return ["Working" + (a.since ? " · " + Math.max(1, Math.round((Date.now() / 1000 - a.since) / 60)) + "m" : ""), "working"];
  if (st === "waiting") return ["Waiting for you", "waiting"];
  if (st === "limited") return ["Usage limit · " + (a.substate || "retrying"), "limited"];
  if (st === "error") return ["Error · " + (a.substate || "retrying"), "error"];
  if (st === "stopped") return ["Off", "stopped"];
  if (st === "starting") return ["Starting", "starting"];
  if (st === "blocked") return ["Blocked", "blocked"];
  if (st === "done") return ["Done", "done"];
  return ["Ready", "idle"];
}
const needs = () => S.st.approvals.map((x) => ({ type: "ap", ...x })).concat(S.st.alerts.map((x) => ({ type: "al", ...x }))).sort((a, b) => a.at - b.at);
const myAgents = () => S.view === S.st.me ? S.st.agents : S.st.remote.filter((a) => a.person === S.view && !a.service);
const otherAgents = () => S.view === S.st.me ? S.st.remote.filter((a) => !a.service) : S.st.agents;
const otherName = () => Object.keys(S.st.people).filter((p) => p !== S.view).map((p) => S.st.people[p]).join(", ");

async function load() {
  S.st = await api("/api/state");
  if (S.st.error) { $("#root").innerHTML = `<div class="empty">${esc(S.st.error)}</div>`; return; }
  try { S.view = localStorage.getItem("hub-view"); const s = localStorage.getItem("hub-sel"); if (s) S.sel = s; } catch (e) {}
  const h = location.hash.slice(1); if (S.st.people[h]) S.view = h;
  if (!S.view || !S.st.people[S.view]) return renderPicker();
  if (S.sel !== "home" && !agentByName(S.sel)) S.sel = "home";
  render(); S.st.agents.forEach((a) => loadEvents(a.name)); stream();
}
function renderPicker() {
  $("#root").innerHTML = `<div class="pick"><div class="cardp"><h1>Avalon</h1><p>Who's at this laptop?</p><div class="ps">${
    Object.entries(S.st.people).map(([k, v]) => `<button data-p="${esc(k)}" class="${k === S.st.me ? "mine" : ""}">${esc(v)}<small>${k === S.st.me ? "This laptop · your agents" : "Their agents"}</small></button>`).join("")}</div></div></div>`;
  document.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => { S.view = b.dataset.p; try { localStorage.setItem("hub-view", S.view); } catch (e) {} S.sel = "home"; render(); S.st.agents.forEach((a) => loadEvents(a.name)); stream(); });
}

function needHtml(x, compact) {
  if (x.type === "ap") return `<div class="need"><span class="who2">${esc(titleOf(x.agent))}</span> wants to run ${esc(x.tool)}${x.risky ? " <b style='color:var(--bad)'>(risky)</b>" : ""}<code>${esc(x.input)}</code><div class="acts"><button class="mini go" data-ap="${esc(x.id)}" data-d="allow">Allow</button>${x.risky ? "" : `<button class="mini" data-ap="${esc(x.id)}" data-d="always">Always for this agent</button>`}<button class="mini" data-ap="${esc(x.id)}" data-d="deny">Deny</button></div></div>`;
  return `<div class="need"><span class="who2">${esc(titleOf(x.agent))}</span> · ${hhmm(x.at)}${x.urgent ? " · <b style='color:var(--bad)'>urgent</b>" : ""}<div class="txt md">${md(x.text)}</div>${compact ? "" : `<div class="acts"><button class="mini" data-dis="${esc(x.id)}">Done</button>${local(x.agent) ? `<button class="mini" data-sel="${esc(x.agent)}">Open ${esc(titleOf(x.agent))}</button>` : ""}</div>`}</div>`;
}
function bellHtml() {
  if (S.view !== S.st.me) return "";
  const nd = needs(); const urgent = nd.some((x) => x.urgent || x.type === "ap");
  const svg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;

const toolName = (n) => n.replace(/^mcp__\w+?__/, "");

const HIDE = new Set(["ToolSearch", "mcp__hub__send_message", "mcp__hub__set_status", "mcp__hub__notify_human"]);

function autosize(t) { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; }

function select(n) { S.sel = n; S.menu = false; S.unread[n] = 0; S.hint = ""; S.hintBad = false; try { localStorage.setItem("hub-sel", n); } catch (e) {} $("#app")?.classList.remove("menu-open"); render(); if (local(n)) loadEvents(n); }

let es;
