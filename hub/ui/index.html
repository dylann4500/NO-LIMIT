<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avalon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<style>
/* Layout: sidebar (navigation + live status) | main (header with countdown and bell; Home, Decisions, or an agent).
   Colour carries meaning everywhere: state (green working, amber needs a person, red error, grey idle),
   card kind (idea blue, research teal, finding violet, change orange, decision green), person (Samuel indigo, Dylan rose). */
:root {
  --bg: #faf9f7; --side: #f3f1ed; --panel: #ffffff; --fg: #1f1e1c; --muted: #6f6b65; --faint: #a19c95;
  --line: #e6e2dc; --hover: #ebe8e2; --accent: #c4673f; --accent-soft: #f6e7df; --bubble: #efece6;
  --ok: #2f8a57; --ok-soft: #e3f3ea; --warn: #b7791f; --warn-soft: #fbf0db; --bad: #c0392b; --bad-soft: #fbe4e1; --idle: #9a958e;
  --k-idea: #2f6fd6; --k-research: #0f8b8d; --k-finding: #7a4fd6; --k-change: #c4673f; --k-decision: #2f8a57;
  --p-samuel: #5b5bd6; --p-dylan: #d6487a;
  --serif: "Newsreader", Georgia, serif; --sans: "Inter", system-ui, -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1c1c1a; --side: #161615; --panel: #252523; --fg: #ecebe8; --muted: #a8a49e; --faint: #6f6c67;
  --line: #33322f; --hover: #2c2b29; --accent: #e08c66; --accent-soft: #3a2a22; --bubble: #30302d;
  --ok: #3fa36f; --ok-soft: #1c3326; --warn: #e5b45a; --warn-soft: #3a3020; --bad: #ef7c6d; --bad-soft: #3d221f; --idle: #7d7a75;
  --k-idea: #6b9cf0; --k-research: #3cc0c2; --k-finding: #a98af0; --k-change: #e08c66; --k-decision: #5cc48d;
  --p-samuel: #8f8ff0; --p-dylan: #f07aa5; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#root { height: 100%; }
.app { display: grid; grid-template-columns: 296px minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: hidden; }
/* sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.brand b { font: 500 1.3rem var(--serif); letter-spacing: -.01em; }
.who { margin-left: auto; font-size: .78rem; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; display: inline-flex; gap: 6px; align-items: center; }
.list { overflow-y: auto; padding: 0 10px 16px; flex: 1; }
.sec { font-size: .67rem; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); padding: 16px 10px 5px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.item { width: 100%; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 9px; align-items: start; text-align: left; background: none; border: 0; border-radius: 9px; padding: 7px 10px; }
.item:hover, .item.on { background: var(--hover); }
.item .nm { font-weight: 500; font-size: .92rem; display: flex; gap: 6px; align-items: baseline; }
.item .st { font-size: .72rem; color: var(--muted); font-weight: 400; }
.item .ln { color: var(--muted); font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.stale, .item.off { opacity: .55; } .item.nav .nm { font-weight: 600; }
.item.attn { box-shadow: inset 3px 0 0 var(--warn); }
.ico { width: 14px; height: 14px; margin-top: 4px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); margin: 7px 2px 0; }
.dot.working, .dot.starting { background: var(--ok); animation: pulse 1.6s infinite; }
.dot.waiting, .dot.blocked { background: var(--warn); } .dot.error, .dot.limited { background: var(--bad); }
.dot.stopped, .dot.offline { background: transparent; border: 1.5px dashed var(--idle); }
.dot.done { background: var(--accent); }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
.pdot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.pdot.samuel { background: var(--p-samuel); } .pdot.dylan { background: var(--p-dylan); }
.pill { font-size: .66rem; font-weight: 600; border-radius: 999px; padding: 0 7px; background: var(--warn-soft); color: var(--warn); margin-top: 4px; white-space: nowrap; }
.badge { background: var(--accent); color: #fff; border-radius: 999px; font-size: .66rem; padding: 0 6px; margin-top: 4px; font-weight: 700; }
.badge.warn { background: var(--warn); color: #1f1e1c; }
.page h2 .badge { margin-top: 0; align-self: center; }
/* main + header */
.main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.top { flex: none; display: flex; align-items: center; gap: 10px; padding: 11px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 54px; }
.top h1 { font: 500 1.2rem var(--serif); margin: 0; }
.top .sp { flex: 1; }
.lbl { font-size: .75rem; border-radius: 999px; padding: 1px 10px; background: var(--hover); color: var(--muted); white-space: nowrap; }
.lbl.working { background: var(--ok-soft); color: var(--ok); }
.lbl.waiting, .lbl.blocked { background: var(--warn-soft); color: var(--warn); }
.lbl.error, .lbl.limited { background: var(--bad-soft); color: var(--bad); }
.count { display: inline-flex; flex-direction: column; align-items: flex-end; font-size: .74rem; color: var(--muted); line-height: 1.25; max-width: 340px; }
.count b { font: 600 .95rem var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.count b.soon { color: var(--warn); } .count b.now { color: var(--bad); }
.count span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
.tbtn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 11px; color: var(--muted); font-size: .82rem; }
.tbtn:hover { color: var(--fg); border-color: var(--muted); }
.tbtn.go { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: .78rem; }
.seg span { padding: 4px 4px 4px 10px; color: var(--muted); } .seg button { border: 0; background: none; padding: 4px 9px; color: var(--muted); }
.seg button.on { background: var(--hover); color: var(--fg); font-weight: 500; }
.menu { position: relative; } .menu .pop { position: absolute; right: 0; top: 34px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; z-index: 5; min-width: 230px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
.menu .pop button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 7px; font-size: .86rem; }
.menu .pop button:hover { background: var(--hover); } .menu .pop .danger { color: var(--bad); }
.bell { position: relative; background: none; border: 1px solid var(--line); border-radius: 9px; width: 34px; height: 30px; display: inline-grid; place-items: center; color: var(--muted); }
.bell:hover { color: var(--fg); border-color: var(--muted); } .bell.has { color: var(--warn); border-color: var(--warn); }
.bell svg { width: 16px; height: 16px; }
.bell .n { position: absolute; top: -6px; right: -7px; background: var(--warn); color: #fff; border-radius: 999px; font-size: .64rem; font-weight: 700; padding: 0 5px; line-height: 1.5; }
.bell.urgent .n { background: var(--bad); }
.strip { flex: none; display: flex; align-items: baseline; gap: 12px; padding: 7px 20px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: .86rem; flex-wrap: wrap; }
.strip .t { font: 600 1.25rem var(--mono); font-variant-numeric: tabular-nums; }
.strip .t.soon { color: var(--warn); } .strip .t.now { color: var(--bad); animation: pulse 1s infinite; }
.strip .what { color: var(--fg); flex: 1; min-width: 200px; } .strip .ph { color: var(--muted); font-size: .76rem; white-space: nowrap; }
.strip.none { color: var(--muted); }
.linkbar { flex: none; background: var(--bad-soft); color: var(--bad); font-size: .84rem; padding: 7px 20px; border-bottom: 1px solid var(--line); }
.scroll { flex: 1; overflow-y: auto; min-height: 0; }
/* notifications */
.panel { position: fixed; top: 56px; right: 16px; width: min(420px, calc(100vw - 32px)); max-height: 74vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.18); z-index: 30; padding: 4px 14px 10px; }
.panel h3 { font: 600 .68rem var(--sans); text-transform: uppercase; letter-spacing: .09em; color: var(--faint); margin: 10px 0 2px; display: flex; justify-content: space-between; }
.panel h3 button { border: 0; background: none; color: var(--accent); font-size: .74rem; text-transform: none; letter-spacing: 0; }
.panel .empty2 { color: var(--muted); font-size: .86rem; padding: 14px 0; text-align: center; }
.need { font-size: .84rem; padding: 9px 0; border-top: 1px solid var(--line); }
.need:first-of-type { border-top: 0; }
.need .who2 { font-weight: 600; } .need code { font: .74rem var(--mono); word-break: break-all; display: block; color: var(--muted); max-height: 3.2em; overflow: hidden; margin-top: 2px; }
.need .txt { overflow-wrap: anywhere; } .need .txt p { margin: 2px 0; }
.acts { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; align-items: center; }
.mini { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 10px; font-size: .78rem; }
.mini:hover { border-color: var(--muted); }
.mini.go { background: var(--ok); color: #fff; border-color: var(--ok); }
.mini.no { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.mini.dark { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.mini:disabled { opacity: .4; cursor: default; }
.toasts { position: fixed; top: 60px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 40; width: min(380px, calc(100vw - 32px)); pointer-events: none; }
.toast { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 9px 12px; font-size: .84rem; animation: tin .18s ease-out; }
.toast.urgent { border-left-color: var(--bad); } .toast.card { border-left-color: var(--k-decision); }
.toast .x { float: right; border: 0; background: none; color: var(--faint); padding: 0 0 0 8px; }
.toast .txt { overflow-wrap: anywhere; max-height: 7.5em; overflow: hidden; } .toast .txt p { margin: 2px 0; }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
/* agent page */
.conv { max-width: 820px; margin: 0 auto; padding: 18px 22px 30px; display: flex; flex-direction: column; gap: 12px; }
.brief { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 8px; z-index: 2; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
.brief.need { border-color: var(--warn); }
.brief .k2 { font-size: .66rem; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 600; display: flex; justify-content: space-between; }
.brief .body { font-size: .92rem; } .brief .body p { margin: 3px 0; } .brief .body ul { margin: 3px 0; padding-left: 20px; }
.brief.clip .body { max-height: 13em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.brief .more { border: 0; background: none; color: var(--accent); font-size: .78rem; padding: 0; align-self: flex-start; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 600; margin-top: 6px; }
.divider::before, .divider::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.u { align-self: flex-end; background: var(--bubble); border-radius: 18px; padding: 8px 16px; max-width: 82%; white-space: pre-wrap; overflow-wrap: anywhere; }
.u .by { display: block; font-size: .7rem; color: var(--muted); }
.u.queued { opacity: .65; border: 1px dashed var(--muted); }
.a { font: 1.03rem/1.62 var(--serif); overflow-wrap: anywhere; } .a p { margin: .45em 0; }
.a.sub { font-size: .94rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }
.md table { border-collapse: collapse; font: .85rem var(--sans); display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 3px 8px; font-variant-numeric: tabular-nums; }
.md code { font: .82em var(--mono); background: var(--hover); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; border-radius: 10px; overflow-x: auto; font-size: .8rem; }
.md pre code { background: none; padding: 0; }
.steps { font: .8rem var(--sans); color: var(--muted); }
.steps > summary { cursor: pointer; list-style: none; } .steps > summary::-webkit-details-marker { display: none; }
.steps .live { color: var(--fg); }
.step { font: .76rem var(--mono); color: var(--muted); padding: 2px 0 2px 14px; overflow: hidden; }
.step > details > summary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; list-style: none; }
.step.err { color: var(--bad); }
.step .res { white-space: pre-wrap; max-height: 220px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 4px 0; }
.msgl { font-size: .86rem; } .msgl > summary { cursor: pointer; list-style: none; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msgl > summary::-webkit-details-marker { display: none; } .msgl b { font-weight: 600; }
.k { font-size: .62rem; text-transform: uppercase; letter-spacing: .07em; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin: 0 6px; color: var(--muted); }
.msgl .body { border-left: 2px solid var(--accent-soft); padding: 2px 0 2px 12px; margin: 4px 0 0 4px; color: var(--fg); }
.div { align-self: center; font-size: .7rem; color: var(--faint); }
.note { align-self: center; font-size: .76rem; color: var(--faint); text-align: center; }
.note.card { color: var(--muted); }
.err { color: var(--bad); font-size: .85rem; white-space: pre-wrap; }
.empty { color: var(--muted); text-align: center; margin: 12vh auto 0; font: 1.12rem var(--serif); max-width: 46ch; }
.comp { flex: none; padding: 0 22px 14px; }
.quick { max-width: 820px; margin: 0 auto 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 11px; font-size: .76rem; color: var(--muted); }
.quick button:hover { color: var(--fg); border-color: var(--muted); }
.box { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px 8px 16px; box-shadow: 0 1px 8px rgba(0,0,0,.04); }
.box textarea { width: 100%; border: 0; resize: none; background: none; color: var(--fg); font: 15px/1.5 var(--sans); min-height: 26px; max-height: 220px; outline: none; }
.box .row { display: flex; align-items: center; gap: 10px; } .box .hint { font-size: .74rem; color: var(--faint); flex: 1; } .box .hint.bad { color: var(--bad); }
.send { width: 32px; height: 32px; border-radius: 9px; border: 0; background: var(--accent); color: #fff; font-size: 1rem; }
.send:disabled { opacity: .35; cursor: default; }
/* home */
.page { max-width: 1000px; margin: 0 auto; padding: 20px 22px 40px; display: flex; flex-direction: column; gap: 22px; }
.page h2 { font: 500 1.08rem var(--serif); margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.acard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.acard:hover { border-color: var(--muted); } .acard.stale { opacity: .55; } .acard.attn { border-color: var(--warn); }
.acard .hd { display: flex; gap: 8px; align-items: center; } .acard .hd b { font: 500 1.02rem var(--serif); } .acard .hd .lbl { margin-left: auto; }
.acard .task { font-size: .86rem; } .acard .last { font-size: .8rem; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.acard .last p { margin: 0; } .acard .meta { font-size: .72rem; color: var(--faint); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.fact { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: .88rem; }
.fact .k2 { font-size: .66rem; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 600; }
.fact input { font: inherit; width: 96px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--fg); }
/* decisions board */
.pcard { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--kc, var(--line)); border-radius: 12px; padding: 11px 14px; display: flex; flex-direction: column; gap: 6px; }
.pcard .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pcard .t { font: 600 .98rem var(--sans); }
.kchip { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--kc); }
.schip { font-size: .7rem; border-radius: 999px; padding: 0 8px; background: var(--hover); color: var(--muted); margin-left: auto; white-space: nowrap; }
.schip.needs_call, .schip.revise { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.schip.running, .schip.planned, .schip.new { background: color-mix(in srgb, var(--k-idea) 14%, transparent); color: var(--k-idea); }
.schip.approved { background: var(--ok-soft); color: var(--ok); } .schip.rejected { background: var(--bad-soft); color: var(--bad); }
.pcard .meta { font-size: .74rem; color: var(--faint); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pcard .meta .dl { color: var(--warn); font-weight: 600; } .pcard .meta .dl.now { color: var(--bad); }
.pcard .body { font-size: .9rem; } .pcard .body p { margin: 3px 0; }
.pcard.clip .body { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 65%, transparent); mask-image: linear-gradient(#000 65%, transparent); }
.thread { border-top: 1px solid var(--line); padding-top: 6px; display: flex; flex-direction: column; gap: 3px; font-size: .8rem; }
.thread .tw b { font-weight: 600; } .thread .tw { color: var(--muted); } .thread .tw.h { color: var(--fg); }
.reply { display: flex; gap: 6px; } .reply textarea, .newidea textarea, .newidea input, .newidea select { font: inherit; font-size: .88rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 6px 9px; }
.reply textarea { flex: 1; min-height: 34px; resize: vertical; }
.newidea { background: var(--panel); border: 1px dashed var(--k-idea); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.newidea.closed textarea, .newidea.closed .row, .newidea.closed .hint { display: none; }
.newidea input { width: 100%; } .newidea textarea { width: 100%; min-height: 64px; resize: vertical; }
.newidea .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .74rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--kc); vertical-align: -1px; }
.tabs { display: flex; gap: 4px; } .tabs button { border: 0; background: none; padding: 4px 10px; border-radius: 8px; color: var(--muted); font-size: .84rem; }
.tabs button.on { background: var(--hover); color: var(--fg); font-weight: 500; }
/* picker */
.pick { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 56px 16px; }
.pick .cardp { text-align: center; width: 100%; max-width: 460px; }
.pick h1 { font: 400 2.1rem/1.2 var(--serif); margin: 0 0 8px; } .pick p { color: var(--muted); margin: 0 0 26px; }
.pick .ps { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pick button { padding: 24px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); font: 500 1.2rem var(--serif); }
.pick button.mine { border-color: var(--accent); } .pick button:hover { border-color: var(--accent); }
.pick small { display: block; font: .76rem var(--sans); color: var(--muted); margin-top: 6px; } .pick button.mine small { color: var(--accent); }
.back { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; } .app .side { display: none; }
  .app.menu-open .side { display: flex; position: fixed; inset: 0; z-index: 20; }
  .back { display: inline-block; } .pick .ps { grid-template-columns: 1fr; } .count { display: none; }
  .legend { display: none; } .tabs { overflow-x: auto; flex-wrap: nowrap; } .tabs button { white-space: nowrap; }
  .strip .what { min-width: 0; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const S = { st: null, view: null, sel: "home", ev: {}, last: {}, unread: {}, briefOpen: {}, open: {}, menu: false, bell: false, toasts: [], toastHtml: "",
  sending: false, hint: "", hintBad: false, pendingRender: false, boardTab: "open", replyFor: null, ideaOpen: false };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (t) => { try { if (!window.marked || !window.DOMPurify) return "<p>" + esc(t) + "</p>"; return DOMPurify.sanitize(marked.parse(String(t || "")), { FORBID_TAGS: ["img", "style", "form", "input", "iframe", "video", "audio"], FORBID_ATTR: ["style"] }); } catch (e) { return "<p>" + esc(t) + "</p>"; } };
const api = async (p, body) => { let r; try { r = await fetch(p, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); } catch (e) { return { error: "The hub isn't answering. Is its terminal window still open?" }; } let j = {}; try { j = await r.json(); } catch (e) {} if (!r.ok && !j.error) j.error = "The hub didn't answer (" + r.status + ")."; return j; };
const hhmm = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
const ago = (t) => { if (!t) return ""; const s = Math.max(0, Date.now() / 1000 - t); return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago"; };
const mmss = (sec) => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m >= 60 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : m + ":" + String(s).padStart(2, "0"); };
const isOv = (n) => /overseer$/.test(n || "");
const local = (n) => S.st.agents.some((a) => a.name === n);
const svc = (n) => S.st.services.find((s) => s.name === n);
const agentByName = (n) => S.st.agents.find((a) => a.name === n) || svc(n) || S.st.remote.find((a) => a.name === n);
const clean = (t) => String(t || "").replace(" (hub)", "");
const personOf = (n) => n && n.startsWith("s-") ? "samuel" : n && n.startsWith("d-") ? "dylan" : Object.keys(S.st.people).find((k) => S.st.people[k] === n) || "";
const titleOf = (n) => { if (!n) return ""; if (n === "hub") return "Hub"; if (Object.values(S.st.people).includes(n)) return n; const a = agentByName(n); const p = personOf(n); const base = a ? clean(a.title || n) : n; return p && p !== S.st.me ? `${base} (${S.st.people[p]})` : base; };
const pdot = (n) => { const p = personOf(n); return p ? `<span class="pdot ${p}" title="${esc(S.st.people[p])}"></span>` : ""; };
const KIND = { idea: "Idea", research: "Research", finding: "Finding", change: "Proposed change", decision: "Live-bot decision" };
const STATUS = { new: "New", planned: "Planned", running: "Running", needs_call: "Needs your call", revise: "Being revised", approved: "Greenlit", rejected: "Rejected", done: "Done", expired: "Expired: default applied", blocked: "Blocked" };
const ICON = {
  home: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>`,
  board: `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,
  bell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`,
};
function label(a) {
  if (!a) return ["", ""];
  if (a.stale) return ["Offline", "offline"];
  const st = a.state;
  if (st === "working") return ["Working" + (a.since ? " · " + Math.max(1, Math.round((Date.now() / 1000 - a.since) / 60)) + "m" : ""), "working"];
  if (st === "waiting") return ["Waiting for you", "waiting"];
  if (st === "limited") return ["Usage limit · " + (a.substate || "retrying"), "limited"];
  if (st === "error") return ["Error · " + (a.substate || "retrying"), "error"];
  if (st === "stopped") return ["Off", "stopped"];
  if (st === "starting") return ["Starting", "starting"];
  if (st === "blocked") return ["Blocked", "blocked"];
  if (st === "done") return ["Done", "done"];
  return ["Ready", "idle"];
}
const props = () => S.st.props || [];
const myCall = (p) => !p.decider || p.decider === S.st.me || p.decider === "both";
const needCall = () => props().filter((p) => p.status === "needs_call" && myCall(p));
const needs = () => S.st.approvals.map((x) => ({ type: "ap", ...x })).concat(S.st.alerts.map((x) => ({ type: "al", ...x }))).concat(needCall().map((p) => ({ type: "pc", agent: p.author, at: p.updated, urgent: !!p.deadline, ...p }))).sort((a, b) => (a.deadline || 9e12) - (b.deadline || 9e12) || a.at - b.at);
const myAgents = () => S.view === S.st.me ? S.st.agents : S.st.remote.filter((a) => a.person === S.view && !a.service);
const otherAgents = () => S.view === S.st.me ? S.st.remote.filter((a) => !a.service) : S.st.agents;
const otherName = () => Object.keys(S.st.people).filter((p) => p !== S.view).map((p) => S.st.people[p]).join(", ");

async function load() {
  S.st = await api("/api/state");
  if (S.st.error) { $("#root").innerHTML = `<div class="empty">${esc(S.st.error)}</div>`; return; }
  try { S.view = localStorage.getItem("hub-view"); const s = localStorage.getItem("hub-sel"); if (s) S.sel = s; } catch (e) {}
  const h = location.hash.slice(1); if (S.st.people[h]) S.view = h;
  if (!S.view || !S.st.people[S.view]) return renderPicker();
  if (!["home", "board"].includes(S.sel) && !agentByName(S.sel)) S.sel = "home";
  render(); S.st.agents.forEach((a) => loadEvents(a.name)); stream();
}
function renderPicker() {
  $("#root").innerHTML = `<div class="pick"><div class="cardp"><h1>Avalon</h1><p>Who's at this laptop?</p><div class="ps">${
    Object.entries(S.st.people).map(([k, v]) => `<button data-p="${esc(k)}" class="${k === S.st.me ? "mine" : ""}"><span class="pdot ${esc(k)}"></span> ${esc(v)}<small>${k === S.st.me ? "This laptop · your agents" : "Their agents"}</small></button>`).join("")}</div></div></div>`;
  document.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => { S.view = b.dataset.p; try { localStorage.setItem("hub-view", S.view); } catch (e) {} S.sel = "home"; render(); S.st.agents.forEach((a) => loadEvents(a.name)); stream(); });
}

// ------------------------------------------------------------------ sidebar
function sidebar() {
  const mine = myAgents(), other = otherAgents();
  const ov = mine.filter((a) => isOv(a.name)), wk = mine.filter((a) => !isOv(a.name));
  const nd = needs();
  const row = (a, cls = "") => { const [l, c] = label(a); const n = nd.filter((x) => x.agent === a.name).length; const u = S.unread[a.name];
    return `<button class="item ${cls} ${a.stale ? "stale" : ""} ${c === "stopped" ? "off" : ""} ${n ? "attn" : ""} ${S.sel === a.name ? "on" : ""}" data-sel="${esc(a.name)}"><span class="dot ${esc(c)}"></span><span style="min-width:0"><div class="nm">${esc(clean(a.title || a.name))}<span class="st">${esc(l)}</span></div><div class="ln">${esc(a.task || (c === "stopped" ? "Not started" : "No task yet"))}</div></span>${n ? `<span class="pill">needs you</span>` : u ? `<span class="badge">${u}</span>` : ""}</button>`; };
  const nc = needCall().length;
  const services = S.view === S.st.me ? S.st.services : [];
  return `<div class="side"><div class="brand"><b>Avalon</b><button class="who" id="who"><span class="pdot ${esc(S.view)}"></span>${esc(S.st.people[S.view])} ▾</button></div>
    <div class="list">
      <button class="item nav ${S.sel === "home" ? "on" : ""}" data-sel="home">${ICON.home}<span><div class="nm">Home</div><div class="ln">Everything at a glance</div></span></button>
      <button class="item nav ${S.sel === "board" ? "on" : ""}" data-sel="board">${ICON.board}<span><div class="nm">Decisions</div><div class="ln">${nc ? nc + " need your call" : "Ideas, findings, changes"}</div></span>${nc ? `<span class="badge warn">${nc}</span>` : ""}</button>
      <div class="sec"><span><span class="pdot ${esc(S.view)}"></span> ${S.view === S.st.me ? "Your agents" : esc(S.st.people[S.view]) + "'s agents"}</span></div>${ov.map((a) => row(a)).join("")}${wk.map((a) => row(a)).join("")}
      ${services.length ? `<div class="sec"><span>Hub services</span></div>${services.map((s) => row(s)).join("")}` : ""}
      ${other.length ? `<div class="sec"><span><span class="pdot ${esc(Object.keys(S.st.people).find((p) => p !== S.view))}"></span> ${esc(otherName())}'s side</span><span>${S.st.bus.online ? "linked" : "not linked"}</span></div>${other.map((a) => row(a)).join("")}` : ""}
    </div></div>`;
}

// ------------------------------------------------------------------ header widgets
function countdownHtml() {
  const ns = S.st.next_step; if (!ns) return S.st.schedule ? "" : `<span class="count"><span>No clock set</span></span>`;
  const left = ns[0] - Date.now() / 1000;
  return `<span class="count" title="${esc(ns[1])}"><b class="${left < 60 ? "now" : left < 180 ? "soon" : ""}" id="cdn" data-at="${ns[0]}">${mmss(left)}</b><span>${esc(ns[1].replace(/^Scored (\d) /, "Round $1 · ").slice(0, 70))}</span></span>`;
}
function stripHtml() {
  const ns = S.st.next_step, sch = S.st.schedule;
  if (!sch) return `<div class="strip none">No clock set. Set minute 0 on Home, or tell your Overseer ("the variant was announced at 14:02").</div>`;
  if (!ns) { const last = sch.start + (60 + 20 * ((sch.scored || 6) - 1)) * 60 * (sch.scale || 1); const due = last + 8 * 60 * (sch.scale || 1);
    return `<div class="strip none">${Date.now() / 1000 < due ? `The last scored round is playing; results due about ${hhmm(due)}.` : "The event is over."}</div>`; }
  const left = ns[0] - Date.now() / 1000;
  const mins = (Date.now() / 1000 - sch.start) / (60 * (sch.scale || 1));
  return `<div class="strip"><span class="t ${left < 60 ? "now" : left < 180 ? "soon" : ""}" id="cdn2" data-at="${ns[0]}">${mmss(left)}</span><span class="what">until <b>${esc(ns[1])}</b> · ${hhmm(ns[0])}</span><span class="ph">${mins < 0 ? "before the event" : mins < 60 ? "build hour · minute " + Math.floor(mins) : "event minute " + Math.floor(mins)}${sch.scale && sch.scale < 1 ? " · simulation ×" + Math.round(1 / sch.scale) : ""}</span></div>`;
}
function bellHtml() {
  const nd = needs(); const urgent = nd.some((x) => x.urgent || x.type === "ap");
  return `<button class="bell ${nd.length ? "has" : ""} ${urgent ? "urgent" : ""}" id="bell" aria-label="Notifications">${ICON.bell}${nd.length ? `<span class="n">${nd.length}</span>` : ""}</button>`;
}
function needHtml(x, compact) {
  if (x.type === "ap") return `<div class="need"><span class="who2">${pdot(x.agent)} ${esc(titleOf(x.agent))}</span> wants to run ${esc(x.tool)}${x.risky ? " <b style='color:var(--bad)'>(risky)</b>" : ""}<code>${esc(x.input)}</code><div class="acts"><button class="mini go" data-ap="${esc(x.id)}" data-d="allow">Allow</button>${x.risky ? "" : `<button class="mini" data-ap="${esc(x.id)}" data-d="always">Always for this agent</button>`}<button class="mini no" data-ap="${esc(x.id)}" data-d="deny">Deny</button></div></div>`;
  if (x.type === "pc") return `<div class="need"><span class="kchip" style="--kc:var(--k-${esc(x.kind)})">${esc(KIND[x.kind] || x.kind)}</span> <span class="who2">${esc(x.title)}</span><div style="color:var(--muted);font-size:.78rem">${pdot(x.author)} ${esc(titleOf(x.author))}${x.deadline ? ` · decide by ${hhmm(x.deadline)}` : ""}</div><div class="acts"><button class="mini go" data-pa="approve" data-pid="${esc(x.id)}">Greenlight</button><button class="mini no" data-pa="reject" data-pid="${esc(x.id)}">Reject</button><button class="mini" data-open-card="${esc(x.id)}">Open</button></div></div>`;
  return `<div class="need"><span class="who2">${pdot(x.agent)} ${esc(titleOf(x.agent))}</span> · ${hhmm(x.at)}${x.urgent ? " · <b style='color:var(--bad)'>urgent</b>" : ""}<div class="txt md">${md(x.text)}</div>${compact ? "" : `<div class="acts"><button class="mini" data-dis="${esc(x.id)}">Done</button>${local(x.agent) ? `<button class="mini" data-sel="${esc(x.agent)}">Open ${esc(titleOf(x.agent))}</button>` : ""}</div>`}</div>`;
}
function panelHtml() {
  if (!S.bell) return "";
  const nd = needs().slice().reverse();
  const groups = [["Waiting for your call", nd.filter((x) => x.type === "pc")], ["Permission requests", nd.filter((x) => x.type === "ap")], ["Notes from your agents", nd.filter((x) => x.type === "al")]];
  return `<div class="panel" id="panel">${groups.filter((g) => g[1].length).map(([t, xs]) => `<h3><span>${t} · ${xs.length}</span>${t.startsWith("Notes") ? `<button id="clearAll">Clear notes</button>` : ""}</h3>${xs.map((x) => needHtml(x, false)).join("")}`).join("") || `<div class="empty2">Nothing needs you right now.</div>`}</div>`;
}
function renderToasts() {
  let box = document.getElementById("toasts");
  if (!box) { box = document.createElement("div"); box.id = "toasts"; box.className = "toasts"; document.body.appendChild(box); }
  const now = Date.now();
  S.toasts = S.toasts.filter((t) => t.until > now && (t.type === "ap" ? S.st.approvals.some((a) => a.id === t.id) : t.type === "pc" ? needCall().some((p) => p.id === t.id) : S.st.alerts.some((a) => a.id === t.id)));
  const html = S.bell ? "" : S.toasts.map((t) => `<div class="toast ${t.type === "pc" ? "card" : t.urgent || t.type === "ap" ? "urgent" : ""}"><button class="x" data-tx="${esc(t.id)}" aria-label="Hide">✕</button>${needHtml(t, t.type === "al")}</div>`).join("");
  if (html === S.toastHtml) return;
  S.toastHtml = html; box.innerHTML = html;
  box.querySelectorAll("[data-tx]").forEach((b) => b.onclick = () => { S.toasts = S.toasts.filter((t) => t.id !== b.dataset.tx); renderToasts(); });

}
function toast(x) { S.toasts.push({ ...x, until: Date.now() + (x.type === "ap" ? 180000 : x.type === "pc" ? 60000 : x.urgent ? 30000 : 9000) }); S.toasts = S.toasts.slice(-4); renderToasts(); setTimeout(renderToasts, x.type === "ap" ? 180500 : x.type === "pc" ? 60500 : x.urgent ? 30500 : 9500); }

// ------------------------------------------------------------------ Home
function agentCard(a) {
  const [l, c] = label(a); const attn = needs().some((x) => x.agent === a.name);
  const sum = a.summary && !/\|\s*#\s*\|[^\n]*\n\|[-| ]+\|\s*(\n\s*)*(\n\nActive|$)/.test(a.summary) ? String(a.summary).split("\n").filter((x) => x.trim()).slice(0, 3).join("\n") : "";
  const evs = S.ev[a.name] || []; const lastTool = [...evs].reverse().find((e) => e.type === "tool");
  const task = a.task ? a.task + (a.state === "idle" && a.idle_since && Date.now() / 1000 - a.idle_since > 120 ? ` (idle since ${hhmm(a.idle_since)})` : "") : (a.state === "working" && lastTool ? "Running " + toolName(lastTool.name) + "…" : "No task yet");
  return `<button class="acard ${a.stale ? "stale" : ""} ${attn ? "attn" : ""}" data-sel="${esc(a.name)}"><div class="hd"><span class="dot ${esc(c)}" style="margin:0"></span><b>${esc(clean(a.title || a.name))}</b>${pdot(a.name)}<span class="lbl ${esc(c)}">${esc(l)}</span></div><div class="task">${esc(task)}</div>${sum ? `<div class="last md">${md(sum)}</div>` : ""}<div class="meta">${[attn ? "<b style='color:var(--warn)'>needs you</b>" : "", a.seen ? "updated " + ago(a.seen) : a.updated ? "updated " + ago(a.updated) : ""].filter(Boolean).join(" · ")}</div></button>`;
}
function homeHtml() {
  const live = S.st.live, sch = S.st.schedule; const nc = needCall();
  const running = props().filter((p) => ["new", "planned", "running"].includes(p.status));
  return `<div class="page">
    <div class="facts">
      <div class="fact"><div class="k2">Clock</div>${sch ? `Minute 0 was ${hhmm(sch.start)}${sch.scale && sch.scale < 1 ? ` · simulation ×${Math.round(1 / sch.scale)}` : ""}<div style="color:var(--faint);font-size:.76rem;margin-bottom:4px">Change it here, or tell your Overseer a time.</div>` : `Set minute 0 (the variant announcement):<br>`}<input id="schin" placeholder="HH:MM" aria-label="Minute 0"> <button class="mini dark" id="schgo">${sch ? "Change" : "Set"}</button></div>
      <div class="fact"><div class="k2">Live bot</div>${live ? esc(live.filename) + (live.note ? " · " + esc(live.note) : "") + `<div style="color:var(--faint);font-size:.76rem">declared by Dylan's Overseer ${ago(live.at)}</div>` : "Not declared yet"}</div>
      <div class="fact"><div class="k2">Decisions</div>${nc.length ? `<b style="color:var(--warn)">${nc.length} need your call</b>` : "Nothing waiting"}${running.length ? ` · ${running.length} idea/research running` : ""}<div><button class="mini" data-sel="board" style="margin-top:4px">Open the board</button></div></div>
      <div class="fact"><div class="k2">Link to ${esc(otherName())}'s laptop</div>${S.st.bus.online ? "Connected" : `<span style="color:var(--bad)">${esc(S.st.bus.error || "Down")}</span>`}${S.st.bus.outbox ? ` · ${S.st.bus.outbox} waiting to send` : ""}</div>
    </div>
    <div><h2><span class="pdot ${esc(S.view)}"></span>${S.view === S.st.me ? "Your agents" : esc(S.st.people[S.view]) + "'s agents"}</h2><div class="cards">${myAgents().map(agentCard).join("") || `<div class="note">None yet.</div>`}</div></div>
    ${S.view === S.st.me && S.st.services.filter((x) => !/clock$/.test(x.name)).length ? `<div><h2>Hub services</h2><div class="cards">${S.st.services.filter((x) => !/clock$/.test(x.name)).map(agentCard).join("")}</div></div>` : ""}
    ${otherAgents().length ? `<div><h2><span class="pdot ${esc(Object.keys(S.st.people).find((p) => p !== S.view))}"></span>${esc(otherName())}'s side</h2><div class="cards">${otherAgents().map(agentCard).join("")}</div></div>` : ""}
  </div>`;
}

// ------------------------------------------------------------------ Decisions board
function pcardHtml(p) {
  const kc = `--kc:var(--k-${esc(p.kind)})`;
  const open = S.open[p.id], long = String(p.body || "").length > 420;
  const left = p.deadline ? p.deadline - Date.now() / 1000 : null;
  const open2 = ["needs_call", "revise"].includes(p.status), isIdea = p.kind === "idea";
  const canAct = open2 && myCall(p);
  const thread = (p.thread || []).map((t) => `<div class="tw ${Object.values(S.st.people).includes(t.who) ? "h" : ""}"><b>${esc(t.who)}</b> · ${hhmm(t.at)}${t.action && !["note", "comment"].includes(t.action) ? ` · ${esc(STATUS[t.action] || t.action)}` : ""}: ${esc(t.text || "")}</div>`).join("");
  const parent = p.parent ? props().find((x) => x.id === p.parent) : null;
  return `<div class="pcard ${long && !open && !canAct ? "clip" : ""}" id="card-${esc(p.id)}" style="${kc}" title="#${esc(p.id)}">
    <div class="hd"><span class="kchip">${esc(KIND[p.kind] || p.kind)}</span><span class="t">${esc(p.title)}</span><span class="schip ${esc(p.status)}">${esc(STATUS[p.status] || p.status)}</span></div>
    <div class="meta">${pdot(p.author)} ${esc(titleOf(p.author))}${p.owner && p.owner !== p.author ? ` → ${pdot(p.owner)} ${esc(titleOf(p.owner))}` : ""} · ${ago(p.created)}${left !== null && canAct ? ` · <span class="dl ${left < 120 ? "now" : ""}">decide within ${mmss(left)}</span>` : ""}${open2 && !myCall(p) ? ` · <b>${esc(S.st.people[p.decider] || "")}'s call</b> (FYI)` : ""}${open2 && p.decider === "both" ? " · <b>either of you</b> can decide" : ""}${parent ? ` · answers <a href="#" data-open-card="${esc(parent.id)}" title="${esc(parent.title)}" style="color:var(--accent);display:inline-block;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom">${esc(parent.title)}</a>` : ""}</div>
    ${p.body ? `<div class="body md">${md(p.body)}</div>${long && !canAct ? `<button class="more" data-toggle-card="${esc(p.id)}" style="border:0;background:none;color:var(--accent);font-size:.78rem;padding:0;align-self:flex-start">${open ? "Show less" : "Show all"}</button>` : ""}` : ""}
    ${thread ? `<div class="thread">${thread}</div>` : ""}

  if (es) return;
  es = new EventSource("/api/stream");
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.kind === "hello" || ev.kind === "resync") { refresh(); S.st.agents.forEach((a) => loadEvents(a.name)); return; }
    if (ev.kind === "event") { const arr = S.ev[ev.agent] = S.ev[ev.agent] || []; if (!arr.some((e) => e.i === ev.event.i)) { arr.push(ev.event); if (ev.event.i > (S.last[ev.agent] ?? -1)) S.last[ev.agent] = ev.event.i; }
      if (ev.agent !== S.sel && ((ev.event.type === "text" && !ev.event.sub) || ev.event.type === "msg_in")) S.unread[ev.agent] = (S.unread[ev.agent] || 0) + 1;
      soon(); }
    else if (ev.kind === "agent") { const i = S.st.agents.findIndex((a) => a.name === ev.name); if (i >= 0) S.st.agents[i] = { ...S.st.agents[i], ...ev }; soon(); }
    else if (ev.kind === "service") { const i = S.st.services.findIndex((s) => s.name === ev.name); if (i >= 0) S.st.services[i] = ev; else S.st.services.push(ev); soon(); }
    else if (ev.kind === "approval") { S.st.approvals.push(ev); toast({ type: "ap", ...ev }); soon(); }
    else if (ev.kind === "approval_done") { S.st.approvals = S.st.approvals.filter((a) => a.id !== ev.id); soon(); }
    else if (ev.kind === "alert") { S.st.alerts.push(ev); toast({ type: "al", ...ev }); soon(); }
    else if (ev.kind === "alert_done") { S.st.alerts = S.st.alerts.filter((a) => a.id !== ev.id); soon(); }
    else if (ev.kind === "prop") { const p = ev.prop; S.st.props = S.st.props || []; const i = S.st.props.findIndex((x) => x.id === p.id); const was = i >= 0 ? S.st.props[i].status : null; if (i >= 0) S.st.props[i] = p; else S.st.props.unshift(p); if (p.status === "needs_call" && was !== "needs_call") toast({ type: "pc", agent: p.author, at: p.updated, ...p }); soon(); }
    else if (ev.kind === "shared") refresh();
  };
  setInterval(refresh, 6000);
  setInterval(() => { const el = $("#cdn2"); if (el) { const left = +el.dataset.at - Date.now() / 1000; el.textContent = mmss(left); el.className = "t " + (left < 60 ? "now" : left < 180 ? "soon" : ""); if (left < -2) refresh(); } }, 1000);
  document.addEventListener("selectionchange", () => { if (S.pendingRender && !window.getSelection().toString()) soon(); });
  document.addEventListener("compositionstart", () => { S.composing = true; });
  document.addEventListener("compositionend", () => { S.composing = false; if (S.pendingRender) soon(); });
  document.addEventListener("mousedown", () => { S.mouseDown = true; });
  document.addEventListener("mouseup", () => { S.mouseDown = false; if (S.pendingRender) setTimeout(soon, 0); });
  document.addEventListener("focusout", () => { if (S.pendingRender) setTimeout(soon, 0); });
  document.addEventListener("click", (e) => { let ch = false; if (S.menu && !e.target.closest(".menu")) { S.menu = false; ch = true; } if (S.bell && !e.target.closest("#panel") && !e.target.closest("#bell") && !e.target.closest(".toasts")) { S.bell = false; ch = true; } if (ch) soon(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.bell || S.menu || S.replyFor)) { S.bell = false; S.menu = false; S.replyFor = null; soon(); } });
}
load();
</script>
