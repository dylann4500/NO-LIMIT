<text x="824.0" y="152.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
<text x="824.0" y="204.0" font-size="12" font-weight="600" fill="#9198a1" text-anchor="middle">any unseen card</text>
<line x1="288" y1="143.0" x2="326" y2="143.0" stroke="#656c76" stroke-width="2"/><path d="M334,143.0 l-10,-6 v12 z" fill="#656c76"/>
<line x1="608" y1="143.0" x2="646" y2="143.0" stroke="#656c76" stroke-width="2"/><path d="M654,143.0 l-10,-6 v12 z" fill="#656c76"/>
<text x="470.0" y="240.0" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">v10 keeps A♠ K♦ (best Monte Carlo equity), then shows the card that doesn't pair the board, so its top pair stays hidden.</text>
</svg>
