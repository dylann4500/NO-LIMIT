<svg xmlns="http://www.w3.org/2000/svg" width="940" height="262" viewBox="0 0 940 262" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">How flop_discard_reveal works</title><desc id="d">Dealt A spades, K diamonds, 7 clubs. On a flop of A hearts, 8 clubs, 2 spades the bot discards the 7, shows the K and hides the A. Opponents see the K plus one unknown card.</desc>
<text x="150.0" y="32.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">1 · Deal</text>
<text x="150.0" y="54.0" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">3 hole cards; normal preflop betting</text>
<text x="470.0" y="32.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">2 · Flop: discard 1, expose 1</text>
<text x="470.0" y="54.0" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">board  A♥ 8♣ 2♠</text>
<text x="790.0" y="32.0" font-size="15" font-weight="600" fill="#f0f6fc" text-anchor="middle">3 · What opponents see</text>
<text x="790.0" y="54.0" font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">every opponent is visible card + hidden card</text>
<g>
<rect x="54.0" y="104" width="56" height="78" rx="6" fill="#ffffff" stroke="#3d444d" stroke-width="1.5"/>
<text x="62.0" y="126.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">A</text>
<text x="82.0" y="168.0" font-size="28" font-weight="400" fill="#1f2328" text-anchor="middle">♠</text>
</g>
<g>
<rect x="122.0" y="104" width="56" height="78" rx="6" fill="#ffffff" stroke="#3d444d" stroke-width="1.5"/>
<text x="130.0" y="126.0" font-size="19" font-weight="700" fill="#cf222e" text-anchor="start">K</text>
<text x="150.0" y="168.0" font-size="28" font-weight="400" fill="#cf222e" text-anchor="middle">♦</text>
</g>
<g>
<rect x="190.0" y="104" width="56" height="78" rx="6" fill="#ffffff" stroke="#3d444d" stroke-width="1.5"/>
<text x="198.0" y="126.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">7</text>
<text x="218.0" y="168.0" font-size="28" font-weight="400" fill="#1f2328" text-anchor="middle">♣</text>
</g>
<g>
<rect x="374.0" y="104" width="56" height="78" rx="6" fill="#ffffff" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="382.0" y="126.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">A</text>
<text x="402.0" y="168.0" font-size="28" font-weight="400" fill="#1f2328" text-anchor="middle">♠</text>
</g>
<text x="402.0" y="204.0" font-size="12" font-weight="600" fill="#9198a1" text-anchor="middle">hidden</text>
<g>
<rect x="442.0" y="104" width="56" height="78" rx="6" fill="#ffffff" stroke="#3d444d" stroke-width="1.5"/>
<text x="450.0" y="126.0" font-size="19" font-weight="700" fill="#cf222e" text-anchor="start">K</text>
<text x="470.0" y="168.0" font-size="28" font-weight="400" fill="#cf222e" text-anchor="middle">♦</text>
</g>
<text x="470.0" y="204.0" font-size="12" font-weight="600" fill="#9198a1" text-anchor="middle">shown</text>
<g opacity="0.35">
<rect x="510.0" y="104" width="56" height="78" rx="6" fill="#ffffff" stroke="#3d444d" stroke-width="1.5"/>
<text x="518.0" y="126.0" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">7</text>
<text x="538.0" y="168.0" font-size="28" font-weight="400" fill="#1f2328" text-anchor="middle">♣</text>
<line x1="516.0" y1="176" x2="560.0" y2="110" stroke="#cf222e" stroke-width="2"/>
</g>
<text x="538.0" y="204.0" font-size="12" font-weight="600" fill="#9198a1" text-anchor="middle">discarded</text>
<g>
<rect x="728.0" y="104" width="56" height="78" rx="6" fill="#ffffff" stroke="#3d444d" stroke-width="1.5"/>
